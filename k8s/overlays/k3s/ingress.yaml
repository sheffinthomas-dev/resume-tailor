apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-tailor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts: [titu-resume-retailor.duckdns.org]
    secretName: resume-tailor-tls
  rules:
  - host: titu-resume-retailor.duckdns.org
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 8787
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8080
