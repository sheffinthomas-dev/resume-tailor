apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-tailor
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 8787
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8080
