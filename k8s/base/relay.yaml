apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
data:
  TARGET_BASE_URL: https://api.tokenbay.com
  RATE_LIMIT_PER_MIN: '20'
  UPSTREAM_TIMEOUT: '120'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  labels:
    app: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: relay
        image: resume-relay
        ports:
        - containerPort: 8787
        envFrom:
        - configMapRef:
            name: relay-config
        - secretRef:
            name: relay-secrets
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet: {path: /healthz, port: 8787}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8787}
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: relay
spec:
  selector:
    app: relay
  ports:
  - port: 8787
    targetPort: 8787
